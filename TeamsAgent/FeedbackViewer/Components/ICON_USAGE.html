<!-- Quick Reference: How to Use Bootstrap Icons in This Project -->

<!-- 
    Bootstrap Icons are now available throughout the application.
    CDN loaded in Components/App.razor
    
    Usage Examples:
    
    1. Basic Icon:
       <i class="bi bi-icon-name"></i>
    
    2. Icon with Text:
       <i class="bi bi-icon-name"></i> Text Here
    
    3. Icon with Custom Size:
       <i class="bi bi-icon-name" style="font-size: 2rem;"></i>
    
    4. Icon with Custom Color:
       <i class="bi bi-icon-name" style="color: #0078d4;"></i>
    
    Common Icons Used in This Project:
    - bi-chat-square-text (Feedback/Messages)
    - bi-house-door-fill (Home)
    - bi-graph-up-arrow (Analytics)
    - bi-bar-chart-fill (Dashboard)
    - bi-arrow-clockwise (Refresh)
    - bi-inbox (Empty State)
    - bi-eye (View)
    - bi-calendar-event (Date/Time)
    
    Browse all available icons:
    https://icons.getbootstrap.com/
    
    Note: Use -fill suffix for filled/solid versions
    Example: bi-house vs bi-house-fill
-->
